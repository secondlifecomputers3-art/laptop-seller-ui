name: laptop_seller_app
description: A laptop seller app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  image_picker_web: ^4.0.0
  url_launcher: ^6.2.4
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true

  assets:
    - assets/laptops.json
    - assets/images/
    - assets/thumbnails/